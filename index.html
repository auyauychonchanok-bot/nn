<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมคณิตศาสตร์ ป.2 - การบวกจำนวนสองจำนวน</title>
  <style>
*{box-sizing:border-box;font-family:'Trebuchet MS','Arial Rounded MT Bold','Sarabun',sans-serif;user-select:none}
body{
  margin:0;min-height:100vh;padding:18px;
  display:flex;flex-direction:column;align-items:center;
  color:#fff;overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 20%,rgba(91,183,255,.45),transparent 28%),
    radial-gradient(circle at 85% 18%,rgba(174,91,255,.42),transparent 30%),
    linear-gradient(180deg,#172b59 0%,#315f9c 48%,#152c48 100%);
  position:relative;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
  background:
    radial-gradient(circle at 8% 78%,#8be9ff 0 2px,transparent 3px),
    radial-gradient(circle at 23% 28%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 72% 76%,#b9f4ff 0 2px,transparent 3px),
    radial-gradient(circle at 91% 43%,#fff 0 1px,transparent 2px);
  background-size:180px 160px,220px 190px,250px 210px,200px 170px;
}
h1{
  margin:4px 0 12px;text-align:center;font-size:clamp(1.25rem,3vw,2rem);
  color:#fff4b0;text-shadow:0 3px 0 #49266e,0 0 14px rgba(255,224,99,.5);
  letter-spacing:.5px;z-index:1;
}
.quiz-card,.game-container{position:relative;z-index:1}
.quiz-card{
  background:linear-gradient(145deg,#38245f,#1f376d);
  border:4px solid #e7b85b;border-radius:28px;
  box-shadow:0 10px 0 #171c45,0 18px 35px rgba(0,0,0,.35);
  padding:28px;max-width:620px;width:100%;margin-top:24px;text-align:center;
}
.quiz-card h2,.game-container h2{color:#fff1a8;text-shadow:0 3px #3a1f60;margin:6px 0 14px}
.quiz-card p{color:#fff;font-size:1.15rem}
.quiz-options{display:flex;gap:18px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn-option{
  padding:14px 25px;font-size:1.2rem;border:3px solid #f2c65c;
  background:linear-gradient(#5d8cff,#3153ba);color:#fff;border-radius:16px;
  cursor:pointer;font-weight:bold;box-shadow:0 6px 0 #20377d,0 8px 18px rgba(0,0,0,.25);
}
.btn-option:active{transform:translateY(4px);box-shadow:0 2px 0 #20377d}

.game-container{
  display:none;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:1120px;
}
.game-container h2{
  margin:8px 0 4px;padding:12px 30px;border:3px solid #e9b955;border-radius:18px;
  background:linear-gradient(90deg,#3b2461,#56328a,#3b2461);
  box-shadow:0 6px 0 #21183f,0 10px 22px rgba(0,0,0,.28);
  font-size:clamp(1rem,2.4vw,1.6rem);text-align:center;
}
.game-workspace{
  display:flex;flex-direction:row;align-items:center;justify-content:center;
  gap:28px;flex-wrap:wrap;width:100%;margin-top:8px;
}
.board-wrapper{
  position:relative;padding:24px 42px;
  border:6px solid #c99143;border-radius:28px;
  background:linear-gradient(135deg,#fff0b5,#f2d887,#fff4c7);
  box-shadow:0 9px 0 #6c4424,0 16px 32px rgba(0,0,0,.35);
}
.board-wrapper:before{
  content:"✦";position:absolute;left:10px;top:7px;color:#54dfff;font-size:1.6rem;
}
.board-wrapper:after{
  content:"✦";position:absolute;right:10px;bottom:6px;color:#a76cff;font-size:1.6rem;
}
.board-grid{display:grid;grid-template-columns:repeat(3,clamp(64px,8vw,82px));gap:12px}
.cell-carry{
  width:clamp(64px,8vw,82px);height:clamp(64px,8vw,82px);
  background:linear-gradient(145deg,#fff8dc,#eacb68);
  border:3px solid #c39135;border-radius:18px;display:flex;
  justify-content:center;align-items:center;position:relative;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.8);
}
.cell-carry.drag-over{background:#ffe477;border:3px dashed #e85b52}
.carry-number{
  display:flex;justify-content:center;align-items:center;
  width:52px;height:52px;border:4px solid #e54b4b;border-radius:50%;
  font-size:1.8rem;font-weight:bold;color:#b93636;background:#fffdf0;
  box-shadow:0 3px 0 #a52c2c;
}
.cell-purple{
  width:clamp(64px,8vw,82px);height:clamp(64px,8vw,82px);
  background:linear-gradient(145deg,#a95cf0,#5b2c9f);
  border:3px solid #d6a1ff;border-radius:18px;
  display:flex;justify-content:center;align-items:center;
  font-size:clamp(2rem,4vw,2.6rem);font-weight:bold;color:#fff;
  text-shadow:0 3px 0 #43206f;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.25),0 6px 0 #351c67;
}
.cell-purple.drop-zone{background:linear-gradient(145deg,#8e53d6,#4c287f);border:3px dashed #f3e7ff}
.cell-purple.drop-zone.drag-over{background:linear-gradient(145deg,#39e68a,#139c62);border:3px solid #fff}
.plus-sign{
  position:absolute;right:7px;top:46%;font-size:2.6rem;font-weight:bold;
  color:#e95143;text-shadow:0 3px 0 #9d2f2a;
}
.palette-container{
  display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(145deg,#3d2767,#1f315f);
  padding:18px;border:4px solid #d7a34c;border-radius:24px;
  box-shadow:0 7px 0 #171c45,0 12px 25px rgba(0,0,0,.3);
}
.palette-title{
  font-size:1.05rem;color:#fff1a8;font-weight:bold;margin-bottom:12px;
  text-shadow:0 2px #39205d;
}
.palette{display:grid;grid-template-columns:repeat(2,62px);gap:11px}
.drag-item{
  width:62px;height:56px;
  background:linear-gradient(145deg,#55a0ff,#2856c5);
  border:3px solid #a9d5ff;color:#fff;font-size:1.65rem;font-weight:bold;
  display:flex;justify-content:center;align-items:center;border-radius:15px;
  cursor:grab;box-shadow:0 5px 0 #1d3c8d,0 4px 10px rgba(0,0,0,.2);touch-action:none;
  text-shadow:0 2px 0 #1d397d;
}
.drag-item:active{transform:translateY(4px);box-shadow:0 1px 0 #1d3c8d}
.btn-submit{
  padding:13px 42px;font-size:1.25rem;
  background:linear-gradient(#42ee83,#18a95e);
  color:#fff;border:4px solid #e5c45e;border-radius:18px;cursor:pointer;
  font-weight:bold;box-shadow:0 6px 0 #087541,0 10px 20px rgba(0,0,0,.3);
  text-shadow:0 2px 0 #087541;margin-top:6px;
}
.btn-submit:active{transform:translateY(4px);box-shadow:0 2px 0 #087541}
#feedback{font-size:1.15rem;font-weight:bold;min-height:30px;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.correct{color:#8cffb9}.incorrect{color:#ff9c9c}
@media(max-width:700px){
  body{padding:10px}.board-wrapper{padding:18px 30px}.game-workspace{gap:16px}
}
</style>
</head>
<body>
  <div style="position:fixed;left:2%;bottom:3%;font-size:4rem;opacity:.18;z-index:0">🏰</div>
  <div style="position:fixed;right:3%;top:18%;font-size:4rem;opacity:.18;z-index:0">🪄</div>

  <h1>🧙‍♂️✨ ดินแดนเวทมนตร์คณิตศาสตร์ ป.2 ✨🪄</h1>

  <!-- ==================== ด่านที่ 1 ==================== -->
  <div id="stage1" class="quiz-card">
    <h2>คำถามด่านที่ 1</h2>
    <p style="font-size: 1.2rem; color: #4b6584;">หลักร้อย เริ่มต้นจากตัวเลขใด ถึง ตัวเลขใด?</p>
    <div class="quiz-options">
      <button class="btn-option" onclick="checkStage1(false)">10 ถึง 99</button>
      <button class="btn-option" onclick="checkStage1(true)">100 ถึง 999</button>
    </div>
    <div id="stage1-feedback" style="margin-top: 15px; font-size: 1.1rem;"></div>
  </div>

  <!-- ==================== ด่านที่ 2 (บวก 2 จำนวน) ==================== -->
  <div id="stage2" class="game-container">
    <h2>⚔️ ด่านที่ 2 • ภารกิจเวทมนตร์: 576 + 285 ⚔️</h2>

    <div class="game-workspace">
      <!-- กระดานคำนวณแบบ 2 ชั้น -->
      <div class="board-wrapper">
        <div class="plus-sign">+</div>
        
        <div class="board-grid">
          <!-- แถวที่ 0: ช่องตัวทด (สีเหลือง) -->
          <div class="cell-carry drop-zone" data-type="carry" data-col="hundreds"></div>
          <div class="cell-carry drop-zone" data-type="carry" data-col="tens"></div>
          <div class="cell-carry drop-zone" data-type="carry" data-col="ones"></div>

          <!-- แถวที่ 1: ตัวตั้ง (576) -->
          <div class="cell-purple">5</div>
          <div class="cell-purple">7</div>
          <div class="cell-purple">6</div>

          <!-- แถวที่ 2: ตัวบวก (285) -->
          <div class="cell-purple">2</div>
          <div class="cell-purple">8</div>
          <div class="cell-purple">5</div>

          <!-- แถวที่ 3: คำตอบ -->
          <div class="cell-purple drop-zone" data-type="result" data-col="hundreds"></div>
          <div class="cell-purple drop-zone" data-type="result" data-col="tens"></div>
          <div class="cell-purple drop-zone" data-type="result" data-col="ones"></div>
        </div>
      </div>

      <!-- คลังบล็อกตัวเลขด้านข้าง -->
      <div class="palette-container">
        <div class="palette-title">💎 เลือกอักษรรูนตัวเลข 💎</div>
        <div class="palette">
          <div class="drag-item" draggable="true" data-val="0">0</div>
          <div class="drag-item" draggable="true" data-val="1">1</div>
          <div class="drag-item" draggable="true" data-val="2">2</div>
          <div class="drag-item" draggable="true" data-val="3">3</div>
          <div class="drag-item" draggable="true" data-val="4">4</div>
          <div class="drag-item" draggable="true" data-val="5">5</div>
          <div class="drag-item" draggable="true" data-val="6">6</div>
          <div class="drag-item" draggable="true" data-val="7">7</div>
          <div class="drag-item" draggable="true" data-val="8">8</div>
          <div class="drag-item" draggable="true" data-val="9">9</div>
        </div>
      </div>
    </div>

    <button class="btn-submit" onclick="validateStage2()">✨ ร่ายเวทส่งคำตอบ ✨</button>
    <div id="feedback"></div>
  </div>

  <script>
    // --- ระบบตรวจสอบด่านที่ 1 ---
    function checkStage1(isCorrect) {
      const fb = document.getElementById('stage1-feedback');
      if (isCorrect) {
        fb.className = 'correct';
        fb.innerText = '✨ ถูกต้องครับ! กำลังเข้าสู่ด่านที่ 2...';
        setTimeout(() => {
          document.getElementById('stage1').style.display = 'none';
          document.getElementById('stage2').style.display = 'flex';
        }, 1000);
      } else {
        fb.className = 'incorrect';
        fb.innerText = '❌ ยังไม่ถูกต้อง ลองคิดใหม่อีกครั้งนะ!';
      }
    }

    // --- ระบบ DRAG AND DROP ---
    let draggedValue = null;

    document.querySelectorAll('.drag-item').forEach(item => {
      item.addEventListener('dragstart', (e) => {
        draggedValue = e.target.getAttribute('data-val');
      });
    });

    document.querySelectorAll('.drop-zone').forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('drag-over');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('drag-over');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        
        if (draggedValue !== null) {
          const zoneType = zone.getAttribute('data-type');
          
          if (zoneType === 'carry') {
            // ใส่ตัวเลขตัวทดพร้อมวงกลมสีแดงล้อมรอบ
            zone.innerHTML = `<div class="carry-number">${draggedValue}</div>`;
          } else {
            // ช่องผลลัพธ์ปกติ (ม่วง)
            zone.innerText = draggedValue;
          }
          
          zone.setAttribute('data-user-val', draggedValue);
        }
      });
    });

    // --- ตรวจสอบคำตอบด่านที่ 2 (โจทย์: 576 + 285 = 861) ---
    // - หลักหน่วย: 6 + 5 = 11 -> ใส่ผลลัพธ์ 1, ทด 1 ไปหลักสิบ
    // - หลักสิบ: 7 + 8 + (ทด 1) = 16 -> ใส่ผลลัพธ์ 6, ทด 1 ไปหลักร้อย
    // - หลักร้อย: 5 + 2 + (ทด 1) = 8 -> ใส่ผลลัพธ์ 8
    function validateStage2() {
      const getVal = (type, col) => {
        const el = document.querySelector(`.drop-zone[data-type="${type}"][data-col="${col}"]`);
        return el ? el.getAttribute('data-user-val') : null;
      };

      const ansCarryTens = getVal('carry', 'tens');         // ตัวทดหลักสิบ = 1
      const ansCarryHundreds = getVal('carry', 'hundreds'); // ตัวทดหลักร้อย = 1
      
      const ansOnes = getVal('result', 'ones');             // ผลลัพธ์หลักหน่วย = 1
      const ansTens = getVal('result', 'tens');             // ผลลัพธ์หลักสิบ = 6
      const ansHundreds = getVal('result', 'hundreds');     // ผลลัพธ์หลักร้อย = 8

      const fb = document.getElementById('feedback');

      if (
        ansOnes === '1' &&
        ansCarryTens === '1' &&
        ansTens === '6' &&
        ansCarryHundreds === '1' &&
        ansHundreds === '8'
      ) {
        fb.className = 'correct';
        fb.innerText = '🎉 เก่งมาก! คุณบวกเลข 2 จำนวนและใส่ตัวทดถูกต้องทุกตำแหน่ง (คำตอบคือ 861)';
      } else {
        fb.className = 'incorrect';
        fb.innerText = '❌ ยังมีตำแหน่งที่ไม่ถูกต้อง ลองตรวจทานตัวเลขและตัวทดอีกครั้งนะ!';
      }
    }
  </script>
</body>
</html>
